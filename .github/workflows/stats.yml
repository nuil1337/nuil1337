name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Экшен readme-tools/github-readme-stats-action всегда подставляет
      # installation-токен github.token (PAT_1: inputs.token || github.token),
      # которому не хватает прав на user-level запросы — карточка падает с
      # "Resource not accessible by integration". Поэтому качаем SVG напрямую
      # с публичного инстанса github-stats-extended (та же организация).
      # Счётчик приватных коммитов доступен только с PAT — считаем публичные.
      - name: download stats.svg
        run: |
          mkdir -p dist
          curl -sfL --retry 3 --retry-delay 5 \
            "https://github-stats-extended.vercel.app/api?username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&disable_animations=false&theme=dracula&locale=en&hide_border=false" \
            -o dist/stats.svg
          grep -q "Something went wrong" dist/stats.svg && { echo "card render error"; exit 1; } || true

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
